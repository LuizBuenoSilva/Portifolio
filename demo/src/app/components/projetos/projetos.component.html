<!-- src/app/components/projetos/projetos.component.html -->

<h2>Adicionar Novo Projeto</h2>
<form (ngSubmit)="salvarProjeto()">
  <input [(ngModel)]="novoProjeto.titulo" name="titulo" placeholder="Título" required />
  <input [(ngModel)]="novoProjeto.urlImagem" name="urlImagem" placeholder="URL da Imagem" />
  <textarea [(ngModel)]="novoProjeto.descricao" name="descricao" placeholder="Descrição"></textarea>
  <input [(ngModel)]="novoProjeto.linkRepositorio" name="linkRepositorio" placeholder="Link do Repositório" />
  <button type="submit">Salvar</button>
</form>

<hr />

<div *ngIf="projetos.length === 0">
  <p>Nenhum projeto encontrado.</p>
</div>

<div *ngFor="let projeto of projetos" class="card">
  <img *ngIf="projeto.urlImagem" [src]="projeto.urlImagem" alt="Imagem do projeto" class="card-img" />
  <div class="card-body">
    <h2>{{ projeto.titulo }}</h2>
    <p>{{ projeto.descricao }}</p>
    <a [href]="projeto.linkRepositorio" target="_blank">Ver no GitHub</a>
  </div>
</div>
